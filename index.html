<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ember — sign in</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="flame">🔥</span>
      <span class="wordmark">Ember</span>
    </div>
    <p class="auth-tagline">Warm words, just between you two.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-signin" type="button">Sign in</button>
      <button class="auth-tab" id="tab-signup" type="button">Create account</button>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="form-signin">
      <div class="field">
        <label for="si-email">Email</label>
        <input type="email" id="si-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="si-password">Password</label>
        <input type="password" id="si-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <form id="form-signup" style="display:none">
      <div class="field">
        <label for="su-name">Your name</label>
        <input type="text" id="su-name" required autocomplete="name" placeholder="Alex Rivera">
      </div>
      <div class="field">
        <label for="su-email">Email</label>
        <input type="email" id="su-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" required autocomplete="new-password" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="auth-hint">Your account works from any device.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
