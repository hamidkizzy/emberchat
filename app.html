<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ember</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ember">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="wordmark"><span class="flame">🔥</span> Ember</div>
      <div class="me-chip">
        <span id="me-name"></span>
        <button id="signout-btn">sign out</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search your chats…">
    </div>

    <button class="new-chat-btn" id="new-chat-btn">
      <span>＋</span> New chat
    </button>

    <div class="conv-list" id="conv-list"></div>
  </aside>

  <section class="chat-panel" id="chat-panel">
    <div class="chat-empty" id="chat-empty">
      <div class="flame-big">🔥</div>
      <p>Pick someone on the left to start chatting.</p>
    </div>

    <div id="chat-active" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header">
        <button class="back-btn" id="back-btn" aria-label="Back to chats">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="avatar sm" id="chat-avatar"></div>
        <div>
          <div class="chat-header-name" id="chat-header-name"></div>
          <div class="chat-header-status" id="chat-header-status"></div>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="img-preview-strip" id="img-preview-strip"></div>

      <div class="composer">
        <button class="icon-btn" id="attach-btn" title="Send a photo or file">📎</button>
        <input type="file" id="file-input" multiple style="display:none">
        <textarea id="text-input" placeholder="Type a message…" rows="1"></textarea>
        <button class="send-btn" id="send-btn" disabled>➤</button>
      </div>
    </div>
  </section>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-actions">
    <button id="lightbox-download" class="primary">⬇ Download full quality</button>
  </div>
</div>

<div class="modal-overlay" id="newchat-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span class="wordmark" style="font-size:17px;">Find someone</span>
      <button class="modal-close" id="newchat-close">×</button>
    </div>
    <div class="search-box" style="margin:0 0 14px;">
      <input type="text" id="newchat-input" placeholder="Search by username…" autocomplete="off">
    </div>
    <div id="newchat-results" class="newchat-results"></div>
  </div>
</div>

<div class="msg-menu" id="msg-menu">
  <button id="menu-copy" type="button">📋 Copy text</button>
  <button id="menu-delete-me" type="button">🗑️ Delete for me</button>
  <button id="menu-delete-everyone" type="button" class="danger">🗑️ Delete for everyone</button>
</div>
<div class="msg-menu-backdrop" id="msg-menu-backdrop"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
